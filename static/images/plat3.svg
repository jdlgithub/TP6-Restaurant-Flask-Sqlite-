<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="300" height="300" style="background:#14213D; image-rendering: pixelated;">
  <!-- Assiette -->
  <circle cx="16" cy="16" r="14" fill="#E5E5E5"/>
  <circle cx="16" cy="16" r="11" fill="#FFFFFF"/>
  <!-- Corps du poisson (Orange grillé) -->
  <ellipse cx="15" cy="16" rx="8" ry="4" fill="#E36414"/>
  <!-- Queue du poisson -->
  <polygon points="23,13 27,10 27,22 23,19" fill="#D90429"/>
  <!-- Détails grillade (lignes sombres) -->
  <line x1="12" y1="13" x2="12" y2="19" stroke="#14213D" stroke-width="1"/>
  <line x1="15" y1="12" x2="15" y2="20" stroke="#14213D" stroke-width="1"/>
  <line x1="18" y1="13" x2="18" y2="19" stroke="#14213D" stroke-width="1"/>
  <!-- Œil -->
  <circle cx="10" cy="15" r="1" fill="#000000"/>
</svg>
